<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>323 Ekspress — Hujjatlar nazorati | Manba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F1E8; --surface:#FFFFFF; --ink:#1E2430; --ink-soft:#5B6472;
    --primary:#0F6B5C; --primary-dark:#0B4E43; --primary-tint:#DFF0EC;
    --gold:#D9A441; --gold-dark:#B9832F; --gold-tint:#FBF3E1;
    --rose:#B23A48; --rose-tint:#F7E6E5;
    --border:#E1DBC9; --shadow:0 4px 18px rgba(30,36,48,.08); --shadow-lift:0 14px 34px rgba(30,36,48,.16);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Manrope',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:700; letter-spacing:-0.01em; margin:0;}
  a{color:inherit;} button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--gold); color:#fff;}
  .ornament{height:10px; width:100%; background-image:repeating-linear-gradient(135deg,var(--primary) 0 6px,transparent 6px 12px); opacity:.5;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* LOGIN */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(circle at 12% 15%,rgba(15,107,92,.10),transparent 42%),radial-gradient(circle at 88% 85%,rgba(217,164,65,.16),transparent 42%),var(--bg);}
  .login-card{width:100%; max-width:410px; background:var(--surface); border-radius:22px; box-shadow:var(--shadow-lift); overflow:hidden; border:1px solid var(--border);}
  .login-body{padding:42px 34px 34px;}
  .login-mark{display:flex; align-items:center; gap:11px; margin-bottom:26px;}
  .login-mark .dot{width:40px;height:40px;border-radius:11px; background:linear-gradient(150deg,var(--primary),var(--primary-dark)); display:flex;align-items:center;justify-content:center; color:#fff; font-size:19px;}
  .login-mark .word{font-size:20px; font-family:'Fraunces',serif; font-weight:700;}
  .login-mark .sub{font-size:10.5px; color:var(--gold-dark); letter-spacing:.06em; font-weight:700;}
  .login-body h1{font-size:25px; margin-bottom:8px;}
  .login-body p.lead{color:var(--ink-soft); font-size:14.5px; margin:0 0 26px; line-height:1.55;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;}
  .field input{width:100%; padding:14px 16px; border-radius:11px; border:1.5px solid var(--border); background:var(--bg); font-size:16px; outline:none;}
  .field input:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint);}
  .login-error{margin-top:12px; font-size:13.5px; color:var(--rose); font-weight:600; display:none;}
  .login-error.show{display:block;}
  .btn{border:none; border-radius:11px; padding:14px 20px; font-size:15px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--primary); color:#fff; width:100%; margin-top:20px;}
  .btn-primary:hover{background:var(--primary-dark);}
  .login-hint{margin-top:22px; padding-top:18px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--ink-soft); line-height:1.6;}

  /* HEADER */
  header.site{background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;}
  .site-header-inner{max-width:900px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{width:34px;height:34px;border-radius:9px; background:linear-gradient(150deg,var(--primary),var(--primary-dark)); display:flex;align-items:center;justify-content:center; color:#fff; font-size:16px;}
  .brand .word{font-family:'Fraunces',serif; font-weight:700; font-size:16.5px; line-height:1.1;}
  .brand .word small{display:block; font-size:9.5px; font-weight:700; color:var(--gold-dark); letter-spacing:.05em; text-transform:uppercase;}
  .header-right{display:flex; align-items:center; gap:14px;}
  .who-pill{font-size:12.5px; font-weight:700; color:var(--primary-dark); background:var(--primary-tint); padding:7px 12px; border-radius:20px;}
  .icon-btn{background:transparent; border:1.5px solid var(--border); border-radius:9px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .icon-btn:hover{border-color:var(--primary); color:var(--primary);}
  main.site-main{max-width:900px; margin:0 auto; padding:32px 24px 100px; width:100%;}

  /* HERO */
  .hero{background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 65%,#137F6C 100%); border-radius:22px; padding:34px 30px; color:#fff; margin-bottom:24px; position:relative; overflow:hidden;}
  .hero::after{content:""; position:absolute; right:-50px; top:-50px; width:210px; height:210px; border-radius:50%; background:rgba(217,164,65,.16);}
  .hero .kicker{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); position:relative;}
  .hero h1{font-size:25px; color:#fff; margin-top:9px; position:relative; line-height:1.3;}
  .hero p{font-size:14px; color:rgba(255,255,255,.88); max-width:580px; margin-top:10px; line-height:1.6; position:relative;}
  .hero-progress{display:flex; align-items:center; gap:14px; margin-top:20px; position:relative;}
  .bar{flex:1; height:8px; background:rgba(255,255,255,.2); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--gold); border-radius:6px; transition:width .4s ease;}
  .hero-progress .pct{font-size:12.5px; font-weight:700; white-space:nowrap;}

  .formula-card{background:var(--surface); border:1.5px solid var(--gold); border-radius:16px; padding:18px 20px; margin-bottom:26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .formula-card .label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--gold-dark);}
  .formula-card .nums{font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:var(--primary-dark); letter-spacing:.02em;}
  .formula-card .note{font-size:12.5px; color:var(--ink-soft); margin-left:auto;}

  .intro-note{background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:18px 20px; margin-bottom:26px; font-size:13.5px; color:var(--ink-soft); line-height:1.65;}
  .intro-note b{color:var(--ink);}

  .section-title{display:flex; align-items:baseline; justify-content:space-between; margin:0 0 16px;}
  .section-title h2{font-size:18.5px;}
  .section-title .count{font-size:12.5px; color:var(--ink-soft); font-weight:600;}

  /* VAGON CARDS */
  .vagon-list{display:flex; flex-direction:column; gap:11px; margin-bottom:20px;}
  .vagon-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:17px 19px; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .15s,box-shadow .15s; display:flex; align-items:center; gap:15px;}
  .vagon-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift);}
  .vagon-card.intro{background:var(--gold-tint); border-color:var(--gold); cursor:default;}
  .vagon-card .num{width:44px; height:44px; border-radius:12px; flex-shrink:0; background:var(--primary-tint); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-size:21px;}
  .vagon-card.done .num{background:var(--primary); color:#fff;}
  .vagon-card .body{flex:1; min-width:0;}
  .vagon-card .kicker{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-dark);}
  .vagon-card h3{font-size:15.5px; line-height:1.3; margin-top:3px;}
  .vagon-card .desc{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-top:4px;}
  .vagon-card .progress-mini{font-size:11.5px; font-weight:700; color:var(--primary-dark); margin-top:6px;}
  .vagon-card .arrow{color:var(--ink-soft); font-size:18px; flex-shrink:0;}

  /* DETAIL PAGE */
  .reader-top{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .back-btn{background:var(--surface); border:1.5px solid var(--border); border-radius:9px; padding:8px 14px; font-size:13px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .back-btn:hover{border-color:var(--primary); color:var(--primary);}
  .reader-head{margin-bottom:22px; display:flex; gap:16px; align-items:flex-start;}
  .reader-head .icon-badge{width:52px; height:52px; border-radius:14px; background:var(--primary-tint); display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;}
  .reader-head .kicker{font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--gold-dark); margin-bottom:6px; display:block;}
  .reader-head h1{font-size:23px; margin-bottom:0; line-height:1.3;}

  .hikoya-box{background:var(--gold-tint); border-left:3px solid var(--gold); border-radius:0 12px 12px 0; padding:16px 18px; margin-bottom:26px; font-size:13.5px; color:#6B4E12; line-height:1.65;}
  .hikoya-box b{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; color:var(--gold-dark);}

  .doc-progress{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
  .doc-progress .bar{flex:1; height:9px;}
  .doc-progress .lbl{font-size:12.5px; font-weight:700; color:var(--primary-dark); white-space:nowrap;}
  .doc-progress .bar{background:var(--border);}

  .doc-list{display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
  .doc-item{background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; gap:14px; align-items:flex-start; transition:border-color .15s, background .15s;}
  .doc-item.checked{border-color:var(--primary); background:var(--primary-tint);}
  .doc-checkbox{width:26px; height:26px; border-radius:8px; border:2px solid var(--border); background:var(--surface); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff; margin-top:2px;}
  .doc-item.checked .doc-checkbox{background:var(--primary); border-color:var(--primary);}
  .doc-body{flex:1;}
  .doc-code{font-size:10.5px; font-weight:700; color:var(--gold-dark); letter-spacing:.04em;}
  .doc-name{font-size:14.5px; font-weight:700; margin-top:3px; line-height:1.35;}
  .doc-purpose{font-size:13px; color:var(--ink-soft); line-height:1.55; margin-top:6px;}
  .doc-purpose b{color:var(--ink);}

  .complete-banner{background:var(--primary-tint); color:var(--primary-dark); border-radius:14px; padding:16px 18px; font-size:14px; font-weight:700; text-align:center; margin-top:8px; display:none;}
  .complete-banner.show{display:block;}

  .hidden{display:none !important;}
  .loading-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:var(--bg);}
  .spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--gold); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-wrap p{color:var(--ink-soft); font-size:13.5px;}

  @media (max-width:720px){ .hero h1{font-size:20px;} .who-pill{display:none;} .reader-head{flex-direction:column;} .formula-card .note{margin-left:0;} }

  .cert-banner{background:linear-gradient(135deg,var(--gold-dark),var(--gold)); border-radius:18px; padding:22px 26px; margin-bottom:24px; color:#fff; display:flex; align-items:center; gap:18px; flex-wrap:wrap; box-shadow:var(--shadow-lift);}
  .cert-banner .icon{font-size:34px;}
  .cert-banner .txt{flex:1; min-width:200px;}
  .cert-banner .txt b{display:block; font-family:'Fraunces',serif; font-size:17px; margin-bottom:3px;}
  .cert-banner .txt span{font-size:12.5px; opacity:.92;}
  .cert-banner button{background:#fff; color:var(--gold-dark); border:none; border-radius:10px; padding:11px 18px; font-weight:800; font-size:13.5px; white-space:nowrap;}
  .cert-banner button:hover{opacity:.92;}

  .cert-page{min-height:100vh; background:#EDEAE0; display:flex; align-items:center; justify-content:center; padding:24px;}
  .cert-sheet{width:100%; max-width:820px; background:#fff; border-radius:6px; padding:60px 56px; box-shadow:0 20px 60px rgba(0,0,0,.25); position:relative; border:10px solid var(--primary); outline:2px solid var(--gold); outline-offset:-18px;}
  .cert-sheet .cert-kicker{text-align:center; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-dark); font-weight:800; margin-bottom:6px;}
  .cert-sheet h1.cert-title{text-align:center; font-family:'Fraunces',serif; font-size:30px; color:var(--primary-dark); margin-bottom:4px;}
  .cert-sheet .cert-sub{text-align:center; font-size:12.5px; color:#7a7261; margin-bottom:34px;}
  .cert-sheet .cert-body{text-align:center;}
  .cert-sheet .cert-body .lbl{font-size:12.5px; color:#8a8270; letter-spacing:.05em; text-transform:uppercase; margin-bottom:10px;}
  .cert-sheet .cert-name{font-family:'Fraunces',serif; font-size:34px; color:var(--primary-dark); border-bottom:2px solid var(--gold); display:inline-block; padding:0 24px 10px; margin-bottom:22px;}
  .cert-sheet .cert-desc{font-size:14.5px; color:#4a4536; line-height:1.7; max-width:560px; margin:0 auto 26px;}
  .cert-sheet .cert-desc b{color:var(--primary-dark);}
  .cert-sheet .cert-footer{display:flex; justify-content:space-between; align-items:flex-end; margin-top:44px; gap:20px;}
  .cert-sheet .cert-date{font-size:12.5px; color:#7a7261;}
  .cert-sheet .cert-seal{width:64px; height:64px; border-radius:50%; border:2.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--gold-dark); flex-shrink:0;}
  .cert-sheet .cert-brand{font-size:12px; color:#7a7261; text-align:right;}
  .cert-sheet .cert-brand b{color:var(--primary-dark); font-family:'Fraunces',serif; font-size:14px; display:block;}
  .cert-actions{max-width:820px; width:100%; display:flex; gap:12px; justify-content:center; margin-top:22px;}
  .cert-actions button{border:none; border-radius:11px; padding:13px 22px; font-weight:800; font-size:14px; cursor:pointer;}
  .cert-actions .btn-print{background:var(--primary); color:#fff;}
  .cert-actions .btn-back{background:#fff; color:var(--primary-dark); border:1.5px solid var(--primary) !important;}
  @media print {
    body *{visibility:hidden;}
    .cert-sheet, .cert-sheet *{visibility:visible;}
    .cert-sheet{position:absolute; left:0; top:0; box-shadow:none; outline:2px solid var(--gold); outline-offset:-18px;}
    .cert-page{background:#fff; padding:0;}
  }
  @media (max-width:720px){
    .cert-sheet{padding:36px 22px;}
    .cert-sheet .cert-name{font-size:24px;}
    .cert-sheet h1.cert-title{font-size:22px;}
  }


  .cert-mtt-line{text-align:center; font-size:13px; color:#6a6352; margin:-14px 0 20px;}
  .cert-mtt-line b{color:inherit;}
  .cert-mtt-field{max-width:820px; width:100%; margin-top:18px; text-align:center;}
  .cert-mtt-field label{display:block; font-size:12px; color:#6a6352; margin-bottom:8px; font-weight:600;}
  .cert-mtt-field input{width:100%; max-width:420px; padding:11px 14px; border-radius:10px; border:1.5px solid var(--border); font-size:14px; outline:none; font-family:'Manrope',sans-serif;}
  .cert-mtt-field input:focus{border-color:var(--primary);}
  @media print{ .cert-mtt-field{display:none;} }

</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://elubafxoxbllogjwfcna.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsdWJhZnhveGJsbG9nandmY25hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMzg0OTYsImV4cCI6MjEwMjgxNDQ5Nn0.9T-HlCcIdX1fsznQ9mDaTVS5ynzTp-iS14cQwKhWyBc";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TITLE = "323-son buyruq — Hujjatlar nazorati";
const SUBTITLE = "\"323 Ekspress\" metodi: har bir lavozim — alohida vagon. Hujjatingiz tayyor bo'lganda belgilab boring.";

let userCodes = [];
let bloks = [];
let state = { view:"loading", userName:null, userCode:null, currentId:null, checked:{} };

function loadingHTML(){ return `<div class="loading-wrap"><div class="spinner"></div><p>Yuklanmoqda...</p></div>`; }

async function loadAllData(){
  const [{data:b,error:bErr},{data:u,error:uErr}] = await Promise.all([
    sb.from('hujjat_bolim').select('*').order('sort_order',{ascending:true}),
    sb.from('user_codes').select('*'),
  ]);
  if(bErr||uErr){ console.error(bErr||uErr); return false; }
  bloks = (b||[]).map(r=>({id:r.id, vagon:r.vagon, icon:r.icon, title:r.title, subtitle:r.subtitle, hikoya:r.hikoya, count:r.doc_count, documents:r.documents||[]}));
  userCodes = (u||[]).map(r=>({code:r.code, name:r.name, active:r.active}));
  return true;
}
async function loadProgress(code){
  const {data} = await sb.from('hujjat_progress').select('*').eq('code',code).maybeSingle();
  state.checked = data ? (data.checked||{}) : {};
}
async function saveProgress(){
  if(!state.userCode) return;
  await sb.from('hujjat_progress').upsert({code:state.userCode, checked:state.checked, updated_at:new Date().toISOString()},{onConflict:'code'});
}

function totalDocs(){ return bloks.reduce((s,b)=>s+b.count,0); }
function checkedCount(){ return Object.values(state.checked).filter(Boolean).length; }
function overallPct(){ const t=totalDocs()||1; return Math.round((checkedCount()/t)*100); }
function blokCheckedCount(b){ return b.documents.filter(d=>state.checked[d.code]).length; }


const CERT_COURSE_TITLE = '323-son Buyruq — Hujjatlar nazorati';

function renderCertBanner(pct, totalDone, total){
  if(pct < 100) return "";
  return `
    <div class="cert-banner">
      <div class="icon">📋</div>
      <div class="txt"><b>Tabriklaymiz! Barcha mavzular tugallandi.</b><span>Endi shaxsiy sertifikatingizni olishingiz mumkin.</span></div>
      <button id="openCertBtn">🏆 Sertifikatni ko'rish</button>
    </div>`;
}

function renderCertificate(){
  const today = new Date();
  const dateStr = today.toLocaleDateString('uz-UZ', { day:'2-digit', month:'long', year:'numeric' });
  return `
  <div class="cert-page">
    <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
      <div class="cert-sheet" id="certSheet">
        <div class="cert-kicker">Manba · Sertifikat</div>
        <h1 class="cert-title">Muvaffaqiyat sertifikati</h1>
        <div class="cert-sub">CERTIFICATE OF COMPLETION</div>
        <div class="cert-body">
          <div class="lbl">Ushbu sertifikat quyidagi shaxsga topshiriladi</div>
          <div class="cert-name">${state.userName || ''}</div>
          <div class="cert-mtt-line" id="certMttLine">${state.mttName ? ('Muassasa: <b>'+escapeHtmlCert(state.mttName)+'</b>') : ''}</div>
          <div class="cert-desc"><b>"${CERT_COURSE_TITLE}"</b> kursidagi barcha mavzularni muvaffaqiyatli va to'liq tugatgani munosabati bilan ushbu sertifikat bilan taqdirlanadi.</div>
          <div class="cert-footer">
            <div class="cert-date">Sana: ${dateStr}</div>
            <div class="cert-seal">📋</div>
            <div class="cert-brand"><b>Manba</b>ta'lim platformasi</div>
          </div>
        </div>
      </div>
      <div class="cert-mtt-field">
        <label for="certMttInput">Muassasa (MTT) nomi — ixtiyoriy, faqat sertifikatda ko'rinadi</label>
        <input id="certMttInput" type="text" placeholder="Masalan: 25-son bog'cha" value="${state.mttName||''}">
      </div>
      <div class="cert-actions">
        <button class="btn-back" id="certBackBtn">← Orqaga</button>
        <button class="btn-print" id="certPrintBtn">🖨️ Chop etish / PDF saqlash</button>
      </div>
    </div>
  </div>`;
}

function escapeHtmlCert(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function bindCertEvents(){
  const openBtn = document.getElementById("openCertBtn");
  if(openBtn) openBtn.addEventListener("click", ()=>{ state.view="certificate"; render(); });
  const backBtn = document.getElementById("certBackBtn");
  if(backBtn) backBtn.addEventListener("click", ()=>{ state.view="main"; render(); });
  const printBtn = document.getElementById("certPrintBtn");
  if(printBtn) printBtn.addEventListener("click", ()=> window.print());
  const mttInput = document.getElementById("certMttInput");
  if(mttInput){
    mttInput.addEventListener("input", (e)=>{
      state.mttName = e.target.value;
      const line = document.getElementById("certMttLine");
      if(line) line.innerHTML = state.mttName ? ("Muassasa: <b>"+escapeHtmlCert(state.mttName)+"</b>") : "";
    });
  }
}

function render(){
  const app = document.getElementById("app");
  if(state.view==="loading") app.innerHTML = loadingHTML();
  else if(state.view==="login") app.innerHTML = renderLogin();
  else if(state.view==="main") app.innerHTML = renderMain();
  else if(state.view==="detail") app.innerHTML = renderDetail(state.currentId);
  else if(state.view==="certificate") app.innerHTML = renderCertificate();
  bindEvents();
  window.scrollTo({top:0, behavior:"instant"});
}

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="ornament"></div>
      <div class="login-body">
        <div class="login-mark"><div class="dot">🚂</div><div><div class="word">Manba · 323</div><div class="sub">HUJJATLAR NAZORATI</div></div></div>
        <h1>Xush kelibsiz</h1>
        <p class="lead">Bu sahifa faqat "Manba" platformasidan kirish kodi olgan xodimlar uchun. Kodingizni kiriting.</p>
        <div class="field"><label for="loginInput">Kirish kodi</label><input id="loginInput" type="text" placeholder="Masalan: AZIZA-1147" autocomplete="off" autocapitalize="characters"></div>
        <div class="login-error" id="loginError">Kod topilmadi yoki faol emas.</div>
        <button class="btn btn-primary" id="loginBtn">Kirish</button>
        <div class="login-hint">Kirish kodingiz yo'qmi? Asosiy "Manba" platformasi administratoridan so'rang.</div>
      </div>
    </div>
  </div>`;
}

async function doLogin(){
  const val=(document.getElementById("loginInput").value||"").trim().toUpperCase();
  const err=document.getElementById("loginError");
  if(!val){ err.textContent="Iltimos, kodni kiriting."; err.classList.add("show"); return; }
  const btn=document.getElementById("loginBtn");
  if(btn){btn.disabled=true; btn.textContent="Tekshirilmoqda...";}
  const found=userCodes.find(u=>u.code.toUpperCase()===val);
  if(found && found.active){
    state.view="main"; state.userName=found.name; state.userCode=found.code;
    await loadProgress(found.code); render(); return;
  }
  if(btn){btn.disabled=false; btn.textContent="Kirish";}
  err.textContent=(found && !found.active)?"Bu kod faol emas.":"Kod topilmadi. Qayta tekshirib ko'ring.";
  err.classList.add("show");
}

function renderMain(){
  const pct = overallPct();
  return `
  <header class="site">
    <div class="site-header-inner">
      <div class="brand"><div class="dot">🚂</div><div class="word">Manba<small>323 Ekspress</small></div></div>
      <div class="header-right"><span class="who-pill">${state.userName}</span><button class="icon-btn" id="logoutBtn" title="Chiqish">⎋</button></div>
    </div>
  </header>
  <main class="site-main">
    <div class="hero">
      <span class="kicker">323-son Buyruq — DMTT 1-ilova, 29.08.2025</span>
      <h1>${TITLE}</h1>
      <p>${SUBTITLE} Har bir vagon — bitta lavozim. Hujjatingizni tayyorlab, ro'yxatda belgilang — qancha qolgani darhol ko'rinadi.</p>
      <div class="hero-progress"><div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div><div class="pct">${checkedCount()}/${totalDocs()} hujjat tayyor</div></div>

    ${renderCertBanner(pct)}
    </div>

    <div class="formula-card">
      <div><div class="label">Oltin formula</div><div class="nums">7-1-1-1-4-3-2-2-4-1</div></div>
      <div class="note">= jami 26 ta hujjat, 10 ta lavozim bo'yicha</div>
    </div>

    <div class="intro-note">🚂 <b>Qanday ishlatish kerak:</b> O'zingizning lavozimingizga mos vagonni toping va uni oching. Har bir hujjat tayyor bo'lganda uni belgilang — progress avtomatik saqlanadi va keyingi safar kirganingizda ham saqlanib qoladi.</div>

    <div class="section-title"><h2>Vagonlar</h2><span class="count">10 ta lavozim</span></div>
    <div class="vagon-list">
      ${bloks.filter(b=>b.count>0).map(b => {
        const done = blokCheckedCount(b);
        const isDone = done===b.count;
        return `
        <div class="vagon-card ${isDone?"done":""}" data-open="${b.id}">
          <div class="num">${isDone?"✓":b.icon}</div>
          <div class="body">
            <span class="kicker">${b.subtitle} · ${b.count} ta hujjat</span>
            <h3>${b.title}</h3>
            <div class="progress-mini">${done}/${b.count} tayyor</div>
          </div>
          <div class="arrow">→</div>
        </div>`;
      }).join("")}
    </div>
  </main>`;
}

function renderDetail(id){
  const b = bloks.find(x=>x.id===id);
  if(!b){ state.view="main"; return renderMain(); }
  const done = blokCheckedCount(b);
  const pct = b.count ? Math.round((done/b.count)*100) : 0;
  return `
  <header class="site">
    <div class="site-header-inner">
      <div class="brand"><div class="dot">🚂</div><div class="word">Manba<small>323 Ekspress</small></div></div>
      <div class="header-right"><span class="who-pill">${state.userName}</span><button class="icon-btn" id="logoutBtn" title="Chiqish">⎋</button></div>
    </div>
  </header>
  <main class="site-main">
    <div class="reader-top"><button class="back-btn" id="backBtn">← Vagonlarga qaytish</button></div>
    <div class="reader-head">
      <div class="icon-badge">${b.icon}</div>
      <div><span class="kicker">${b.subtitle}</span><h1>${b.title}</h1></div>
    </div>

    <div class="hikoya-box"><b>Nega shunday?</b>${b.hikoya}</div>

    <div class="doc-progress"><div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div><div class="lbl">${done}/${b.count} tayyor</div></div>

    <div class="doc-list">
      ${b.documents.map(d => {
        const isChecked = !!state.checked[d.code];
        return `
        <div class="doc-item ${isChecked?"checked":""}" data-toggle-doc="${d.code}">
          <div class="doc-checkbox">${isChecked?"✓":""}</div>
          <div class="doc-body">
            <div class="doc-code">${d.code}</div>
            <div class="doc-name">${d.name}</div>
            <div class="doc-purpose"><b>Nima uchun kerak:</b> ${d.purpose}</div>
          </div>
        </div>`;
      }).join("")}
    </div>

    <div class="complete-banner ${done===b.count?"show":""}">✓ Ushbu lavozim bo'yicha barcha hujjatlar tayyor deb belgilandi!</div>
  </main>`;
}

function toggleDoc(code){
  state.checked[code] = !state.checked[code];
  render(); saveProgress();
}

function bindEvents(){
  bindCertEvents();
  const app = document.getElementById("app");
  const loginBtn = document.getElementById("loginBtn");
  if(loginBtn){ loginBtn.addEventListener("click", doLogin); document.getElementById("loginInput").addEventListener("keydown", e=>{if(e.key==="Enter") doLogin();}); }
  const logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.addEventListener("click", ()=>{ state={view:"login",userName:null,userCode:null,checked:{}}; render(); });
  app.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click", ()=>{ state.view="detail"; state.currentId=el.dataset.open; render(); }));
  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.addEventListener("click", ()=>{ state.view="main"; render(); });
  app.querySelectorAll("[data-toggle-doc]").forEach(el=>el.addEventListener("click", ()=> toggleDoc(el.dataset.toggleDoc)));
}

async function init(){
  render();
  try{
    const ok = await loadAllData();
    if(!ok){ document.getElementById("app").innerHTML = `<div class="loading-wrap"><p>Ma'lumotlarni yuklab bo'lmadi. Internetni tekshiring va sahifani yangilang.</p></div>`; return; }
  } catch(e){ console.error(e); document.getElementById("app").innerHTML = `<div class="loading-wrap"><p>Ulanishda xatolik yuz berdi.</p></div>`; return; }
  state.view="login"; render();
}
init();
</script>
</body>
</html>
